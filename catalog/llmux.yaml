name: llmux
title: LLMUX
repo: https://github.com/ivcained/llmux
sha: ff263e550a1ecc8a8c0b012b22e6043b091afaf1
description: "Cross-marketplace LLM router: unions the Surplus Intelligence and Antseed inference markets behind one Hermes provider, routes each request by cheapest, fastest or balanced policy, and adds a composer card that shows the current route, named sellers with measured median TPS and time-to-first-token, comparable models in the same price tier, and a one-click mid-chat switch. Disclosure — registers one model provider at import (base URL http://127.0.0.1:8378/v1) and starts one detached local child process, `python -m llmux_core`, bound to 127.0.0.1 only; it is skipped when that port is already served or LLMUX_AUTOSTART=0, and its output is appended to ~/.hermes/logs/llmux-proxy.log. That child makes outbound HTTPS requests to https://api.surplusintelligence.ai and local HTTP requests to an optional Antseed buyer proxy at http://127.0.0.1:8377. The plugin writes no other files, holds no wallet or private key, performs no on-chain action, contains no self-updating code, and never patches Hermes or Desktop: the desktop half uses only the plugin SDK, and the dashboard half exposes read-only passthrough routes to the local proxy."
maintainer: ivcained
tier: community
category: models
requires_hermes: ">=0.22.5"
version: "0.1.0"
docs_url: https://github.com/ivcained/llmux#readme
readme: true
platforms: []
known_issues:
  - "Surplus inference needs a funded SURPLUS_API_KEY (inf_...) visible to the gateway process; the Antseed leg is optional and needs its local buyer proxy running with a funded payment channel."
  - "Marketplace price and speed figures are upstream measurements (median, trailing 24h). They move with seller liquidity, so the card re-reads them rather than caching long."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - SURPLUS_API_KEY
