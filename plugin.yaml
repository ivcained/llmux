name: llmux
kind: model-provider
version: "0.1.1"
manifest_version: 2
description: "LLMUX compares Surplus Intelligence, Antseed and Solid offers behind one Hermes provider. Route by cheapest, fastest or balanced policy, with seller trust signals and explicit source overrides in the desktop composer."
author: ivcained
license: MIT
requires_hermes: ">=0.22.5"
tags: [llm, routing, marketplace, cost, latency, surplus, antseed, desktop]
config_schema:
  surplus_api_key: {type: secret, env: SURPLUS_API_KEY, description: "Surplus marketplace API key for this Hermes profile"}
  surplus_override_key: {type: secret, env: LLMUX_SURPLUS_API_KEY, description: "Optional LLMUX-specific Surplus key override"}
  solid_api_key: {type: secret, env: SOLID_API_KEY, description: "Optional Solid API key for this Hermes profile"}
  solid_override_key: {type: secret, env: LLMUX_SOLID_API_KEY, description: "Optional LLMUX-specific Solid key override"}
  solid_existing_provider_key: {type: secret, env: HERMES_CUSTOM_SOLID_API_KEY, description: "Existing Hermes custom Solid provider key, if already configured"}
